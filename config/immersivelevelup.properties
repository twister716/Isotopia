# Immersive Level Up - client-side settings. Unknown keys are ignored with a warning in the log.
# Theme: auto (follows Immersive Screens when installed, else classic) | classic | halloween | hologram | winter | space | arcade | off
theme=auto

# Size per moment: off | subtle | normal | epic
moment.level=subtle
moment.milestone=normal
moment.advancement.task=subtle
moment.advancement.goal=subtle
moment.advancement.challenge=normal
moment.firstTime=normal
moment.newDimension=normal
moment.worldDays=normal
moment.totem=normal
moment.armorSet=normal
moment.depthHeight=subtle
moment.closeCall=subtle
moment.playStreak=subtle
moment.ftbq.task=off
moment.ftbq.quest=subtle
moment.ftbq.chapter=epic
moment.ftbq.book=epic
# Levels that count as milestones, and the ones that are epic
milestones=5,10,20,30,50,100
moment.milestone.epicAt=30,50,100
# World days that count (and the epic ones), days in a row with the game played
worldDays=10,50,100,365
worldDays.epicAt=100,365
playStreak=3,7,30
playStreak.normalAt=30

# Pieces of the effect (each one separately; not tied to reduceMotion)
piece.pillar=true
piece.ring=true
piece.particles=true
piece.title=true
piece.cameraZoom=false

# Sound: none by default. Any sound id from the game or a resource pack.
sounds=false
sound.milestone=minecraft:entity.player.levelup
sound.volume=0.6

# Title on screen: above_xp_bar | top_center | bottom_left | bottom_right | top_left
title.anchor=above_xp_bar
title.offsetX=0
title.offsetY=0
title.scale=1.0
# How long it stays (0.5..2.0) and how fast it animates (0.5..2.0), separately
duration=1.0
animationSpeed=1.0

# Behaviour
mergeWindowSeconds=3
bigEffectCooldownSeconds=20
calmAfterCombat=true
waitWhileScreenOpen=true
creativeCounts=false
# Advancements of these namespaces are never celebrated, e.g. a server plugin that grants hundreds: ignoreNamespaces=myserver,questpack
ignoreNamespaces=

# Compatibility: the optional FTB Quests bridge (quest/chapter/book completions; tasks are off above)
ftbquests=true

# Accessibility. reduceMotion: no moving pillar or sparks, a soft glow and the title only (also follows Immersive Screens' switch)
reduceMotion=false
# never full-screen light; can't be turned off
flashSafe=true
narrate=false

# Performance
maxParticles=300
maxDistance=32
quality=high

# Colours (hex) per theme: colors.<theme>.pillar / colors.<theme>.title
colors.classic.pillar=#FFC44A
colors.classic.title=#FFE9A8
colors.halloween.pillar=#FF7A1A
colors.halloween.title=#FF9A2E
colors.hologram.pillar=#2AB8FF
colors.hologram.title=#8FF0FF
colors.winter.pillar=#9ED8FF
colors.winter.title=#E6F8FF
colors.space.pillar=#A070FF
colors.space.title=#F2EAFF
colors.arcade.pillar=#FFD21E
colors.arcade.title=#FFE21E
