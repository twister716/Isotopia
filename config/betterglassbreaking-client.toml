#Damaged glass stays clear with white cracks regardless of this setting.
frostedDamagedGlass = true
#Shard count multiplier; higher values show more flying shards.
# Default: 1.0
# Range: 0.0 ~ 2.0
shardAmount = 1.0
#Maximum visible shards in particles; higher values show more shards at once.
# Default: 512
# Range: 0 ~ 4096
maxLiveShards = 512
#Shard lifetime in ticks plus up to 14 random ticks; higher values keep shards longer.
# Default: 38
# Range: 1 ~ 1200
shardLifetimeTicks = 38
