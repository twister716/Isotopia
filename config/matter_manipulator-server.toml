[building]
	#Hard cap for a single queued manipulator operation. Planning is synchronous on the server thread, so values above 262144 are clamped to it at runtime.
	# Default: 131072
	# Range: 1 ~ 5000000
	maxQueuedBlocks = 131072
	#Largest bounding-box volume that exchange, copy, and move may scan while planning. Checked before any block is inspected.
	# Default: 262144
	# Range: 1 ~ 16777216
	maxRegionVolume = 262144
	#Largest group of connected blocks (doors, rails and their supports, redstone, fluids, ...) that a move transfers at once, within one server tick. Larger groups are left in place and reported when the move is planned.
	# Default: 512
	# Range: 1 ~ 8192
	maxAtomicMoveGroup = 512
	#Largest blueprint, in uncompressed bytes, that a player may upload or the server saves or reads. A blueprint also holds at most maxRegionVolume blocks.
	# Default: 8388608
	# Range: 65536 ~ 67108864
	maxBlueprintBytes = 8388608
	# Default: 100
	# Range: 0 ~ 1000000
	prototypeFePerBlock = 100
	# Default: 250
	# Range: 0 ~ 1000000
	mkiFePerBlock = 250
	# Default: 500
	# Range: 0 ~ 1000000
	mkiiFePerBlock = 500
	# Default: 1000
	# Range: 0 ~ 1000000
	mkiiiFePerBlock = 1000
